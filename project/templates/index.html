<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Chat (RAG)</title>

  <style>
    :root {
      --primary:#0b66ff;
      --success:#0b8a3e;
      --danger:#d93025;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e2e2e2;
      --muted:#777;
    }

    * { box-sizing:border-box }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 24px;
    }

    h2, h3 {
      margin: 0 0 12px;
    }

    .app {
      max-width: 900px;
      margin: auto;
      background: var(--card);
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    form {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="file"] {
      border: 1px dashed var(--border);
      padding: 8px;
      border-radius: 6px;
      background: #fafafa;
    }

    button {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      background: var(--primary);
      color: #fff;
    }

    button:hover { opacity:.9 }

    #abort {
      background: var(--danger);
    }

    #spinner {
      display:none;
      width:16px;
      height:16px;
      border:3px solid #ddd;
      border-top-color:var(--primary);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform:rotate(0deg) }
      to   { transform:rotate(360deg) }
    }

    #status {
      margin-top: 8px;
      color: var(--muted);
      font-size: .9em;
    }

    #chat {
      margin-top: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      height: 320px;
      overflow-y: auto;
      background: #fafafa;
      border-radius: 8px;
    }

    .msg {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.4;
      max-width: 80%;
    }

    .user {
      margin-left: auto;
      background: #e6f0ff;
      color: var(--primary);
    }

    .bot {
      background: #edf7ed;
      color: var(--success);
    }

    #controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #question {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>
  <div class="app">
    <h2>Upload PDF and Chat</h2>

    <form id="uploadForm">
      <input type="file" id="files" accept="application/pdf" multiple />
      <button type="submit">Upload & Process</button>
      <div id="spinner" aria-hidden="true"></div>
    </form>

    <p id="status">No PDFs uploaded yet.</p>

    <div id="sessionUI" style="display:none">
      <h3>Session: <span id="sessionId"></span></h3>

      <div id="chat"></div>

      <div id="controls">
        <input id="question" placeholder="Ask something..." />
        <button id="send">Send</button>
        <button id="abort">Abort & Delete Data</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
